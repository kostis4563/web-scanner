<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebScanner</title>
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090909" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f1ee" />
    <script>
      // Resolve theme before paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('ws-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
